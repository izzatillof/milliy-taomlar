<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin panel — Milliy taomlar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:#202820;font-family:Arial,sans-serif}header{background:#173d2a;color:#fff;padding:20px}main{max-width:1100px;margin:25px auto;padding:0 16px}.card{background:#fff;padding:20px;border-radius:16px;border:1px solid #e7e2d7;margin-bottom:18px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd8cd;border-radius:9px;font:inherit;margin:5px 0 12px}button,.btn{border:0;background:#173d2a;color:#fff;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}button.danger{background:#a3362a}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.product{border:1px solid #e8e3d8;border-radius:12px;padding:14px}.product h3{margin:0 0 5px}.muted{color:#6d756e;font-size:13px}.msg{margin:10px 0;color:#1b6631}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><header><h2 style="margin:0">⚙ Admin panel</h2><div>Milliy taomlar menyusi va narxlarini boshqarish</div></header><main>
<section id="login" class="card"><h3>Admin sifatida kirish</h3><p class="muted">Admin parolini loyiha sozlamasida belgilagan bo‘lishingiz kerak.</p><form id="loginForm"><label>Parol</label><input id="password" type="password" required autocomplete="current-password"><button>Kirish</button></form><div id="loginMsg" class="msg"></div></section>
<section id="panel" class="hidden"><div class="card"><h3 id="formTitle">Yangi mahsulot qo‘shish</h3><form id="foodForm"><input id="id" type="hidden"><div class="row"><div><label>Nomi</label><input id="name" required maxlength="80"></div><div><label>Narxi (so‘m)</label><input id="price" type="number" min="0" step="500" required></div><div><label>Kategoriya</label><select id="category"><option>Asosiy taom</option><option>Xamirli taom</option><option>Gril</option><option>Salqin ichimliklar</option><option>Sushi va rollar</option><option>Desertlar</option></select></div><div><label>Emoji</label><input id="emoji" value="🍽️" maxlength="8"></div></div><label>Rasm URL</label><input id="image" type="url" placeholder="https://..."><label>Qisqa tavsif</label><textarea id="desc" rows="2" maxlength="250"></textarea><button id="saveBtn">Saqlash</button> <button type="button" id="cancelEdit" style="background:#777" class="hidden">Bekor qilish</button></form><div id="saveMsg" class="msg"></div></div>
<div class="card"><h3>Mavjud menyu</h3><p class="muted">O‘zgartirishlar saqlangach, asosiy menyuda ham ko‘rinadi.</p><div id="products" class="products"></div></div><button id="logout" type="button">Chiqish</button> <a class="btn" href="/">Asosiy menyuga qaytish</a></section>
</main><script>
const $=id=>document.getElementById(id);let foods=[];async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xatolik yuz berdi');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){foods=await api('/api/admin/menu');$('products').innerHTML=foods.map(f=>`<article class="product"><h3>${esc(f.emoji||'🍽️')} ${esc(f.name)}</h3><b>${Number(f.price).toLocaleString('uz-UZ')} so‘m</b><p class="muted">${esc(f.category)} · ${esc(f.desc||'')}</p><div><button onclick="editFood('${esc(f.id)}')">Tahrirlash</button> <button class="danger" onclick="removeFood('${esc(f.id)}')">O‘chirish</button></div></article>`).join('')||'<p>Menyu bo‘sh.</p>'}
function showPanel(){ $('login').classList.add('hidden');$('panel').classList.remove('hidden');refresh().catch(e=>alert(e.message)) }
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});showPanel()}catch(err){$('loginMsg').textContent=err.message}};
window.editFood=id=>{const f=foods.find(x=>x.id===id);if(!f)return;$('id').value=f.id;$('name').value=f.name;$('price').value=f.price;$('category').value=f.category;$('emoji').value=f.emoji||'🍽️';$('image').value=f.image||'';$('desc').value=f.desc||'';$('formTitle').textContent='Mahsulotni tahrirlash';$('saveBtn').textContent='O‘zgarishni saqlash';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
$('cancelEdit').onclick=()=>{$('foodForm').reset();$('id').value='';$('formTitle').textContent='Yangi mahsulot qo‘shish';$('saveBtn').textContent='Saqlash';$('cancelEdit').classList.add('hidden')};
$('foodForm').onsubmit=async e=>{e.preventDefault();const f={id:$('id').value||('taom-'+Date.now()),name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,emoji:$('emoji').value.trim()||'🍽️',image:$('image').value.trim(),desc:$('desc').value.trim()};try{await api('/api/admin/menu',{method:'PUT',body:JSON.stringify({food:f})});$('saveMsg').textContent='Saqlandi!';$('cancelEdit').click();await refresh()}catch(err){$('saveMsg').textContent=err.message}};
window.removeFood=async id=>{if(!confirm('Bu mahsulotni menyudan o‘chirasizmi?'))return;try{await api('/api/admin/menu',{method:'DELETE',body:JSON.stringify({id})});await refresh()}catch(e){alert(e.message)}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'}).catch(()=>{});location.reload()};
(async()=>{try{await api('/api/admin/menu');showPanel()}catch(e){}})();
</script></body></html>
